Children:
- Name: LinearNormalization
  Id: g=3fee9962388d46f8ef3380aeca2cce6d
  Supertype: ExpressionEvaluator
  ReferenceType: HasComponent
  Children:
  - Name: Expression
    Type: BaseDataVariableType
    DataType: String
    ReferenceType: HasParameter
    ModellingRule: Optional
    Value: "((({#Value} - {#MinValue}) /({#MaxValue}- {#MinValue}))*100)+10"
  - Name: ns=5;SourceValue
    Type: BaseDataVariableType
    DataType: BaseDataType
    ReferenceType: HasSource
    Children:
    - Name: DynamicLink
      Type: DynamicLink
      DataType: NodePath
  - Name: ns=5;SourceMinValue
    Type: BaseDataVariableType
    DataType: BaseDataType
    ReferenceType: HasSource
    Children:
    - Name: DynamicLink
      Type: DynamicLink
      DataType: NodePath
  - Name: ns=5;SourceMaxValue
    Type: BaseDataVariableType
    DataType: BaseDataType
    ReferenceType: HasSource
    Children:
    - Name: DynamicLink
      Type: DynamicLink
      DataType: NodePath
